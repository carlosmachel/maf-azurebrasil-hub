name: Sync MAF Episodes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'episodios/**'
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: 
  contents: write
  
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descobrir e clonar repos maf-video-*
        run: |
          repos=$(curl -s \
            "https://api.github.com/users/carlosmachel/repos?per_page=100&type=public" \
            | jq -r '.[].name | select(test("^maf-video-[0-9]+$"))' \
            | sort -t'-' -k3 -n)

          rm -rf episodios/
          mkdir -p episodios

          for name in $repos; do
            echo "Clonando $name..."
            git clone --depth 1 \
              "https://github.com/carlosmachel/$name" \
              "episodios/$name"
            rm -rf "episodios/$name/.git"
          done

      - name: Gerar README e página do GitHub Pages
        run: |
          chmod +x scripts/generate-index.sh
          scripts/generate-index.sh

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodios/ README.md docs/
          if git diff --staged --quiet; then
            echo "Nada para commitar."
            exit 0
          fi
          git commit -m "sync: $(date +'%Y-%m-%d')"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $attempt), sincronizando com origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Falha ao dar push após várias tentativas."
          exit 1
