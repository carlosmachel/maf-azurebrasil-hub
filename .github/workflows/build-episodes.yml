name: Build Episodes

# Compila cada episódio separadamente para garantir que o código dos vídeos continua funcionando.
on:
  workflow_run:
    workflows: ["Sync MAF Episodes"]
    types: [completed]
  push:
    branches: [main]
    paths: ['episodios/**', '.github/workflows/build-episodes.yml']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build de cada episódio
        run: |
          failed=0
          {
            echo "| Episódio | Projeto | Build |"
            echo "|----------|---------|-------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in $(ls -d episodios/maf-video-* | sort -t- -k3 -n); do
            name=$(basename "$dir")
            target=$(find "$dir" -maxdepth 1 \( -name '*.sln' -o -name '*.slnx' \) | head -1)
            [ -z "$target" ] && target=$(find "$dir" -name '*.csproj' -not -path '*/obj/*' | head -1)

            if [ -z "$target" ]; then
              echo "| $name | — | ⚪ sem código |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "::group::$name"
            if dotnet build "$target" -nologo -v q; then
              echo "| $name | $(basename "$target") | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | $(basename "$target") | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=$name::build falhou"
              failed=1
            fi
            echo "::endgroup::"
          done

          exit $failed
