<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Card gradients -->
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">How Skills Work</text>
  <text x="450" y="76" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="400">Progressive Disclosure — load only what's needed, when it's needed</text>

  <!-- ==================== STEP 1: Discovery ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="230" height="280" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" opacity="0.95"/>
    <!-- Badge -->
    <rect x="60" y="125" width="28" height="28" rx="8" fill="url(#card1)"/>
    <text x="74" y="145" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">1</text>
    <text x="98" y="145" fill="#c7d2fe" font-size="15" font-weight="700">Discovery</text>
    <!-- Divider -->
    <line x1="55" y1="162" x2="255" y2="162" stroke="#334155" stroke-width="1"/>
    <!-- Icon: eye / scan -->
    <g transform="translate(115, 190)">
      <ellipse cx="40" cy="30" rx="38" ry="24" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.7"/>
      <circle cx="40" cy="30" r="12" fill="none" stroke="#818cf8" stroke-width="2"/>
      <circle cx="40" cy="30" r="5" fill="#818cf8" opacity="0.8"/>
    </g>
    <!-- Description -->
    <text x="155" y="268" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="400">
      <tspan x="155" dy="0">At startup, agents load</tspan>
      <tspan x="155" dy="17">only the <tspan fill="#c7d2fe" font-weight="600">name</tspan> and</tspan>
      <tspan x="155" dy="17"><tspan fill="#c7d2fe" font-weight="600">description</tspan> of each skill.</tspan>
      <tspan x="155" dy="22" fill="#64748b" font-size="10.5">Just enough to know when</tspan>
      <tspan x="155" dy="15" fill="#64748b" font-size="10.5">it might be relevant.</tspan>
    </text>
  </g>

  <!-- Arrow 1 → 2 -->
  <g>
    <line x1="278" y1="250" x2="326" y2="250" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="326,244 340,250 326,256" fill="#a78bfa"/>
  </g>

  <!-- ==================== STEP 2: Activation ==================== -->
  <g filter="url(#shadow)">
    <rect x="345" y="110" width="230" height="280" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <!-- Badge -->
    <rect x="365" y="125" width="28" height="28" rx="8" fill="url(#card2)"/>
    <text x="379" y="145" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">2</text>
    <text x="403" y="145" fill="#ddd6fe" font-size="15" font-weight="700">Activation</text>
    <!-- Divider -->
    <line x1="360" y1="162" x2="560" y2="162" stroke="#334155" stroke-width="1"/>
    <!-- Icon: document loading -->
    <g transform="translate(420, 182)">
      <rect x="8" y="0" width="44" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.7"/>
      <text x="30" y="22" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700">SKILL</text>
      <text x="30" y="34" text-anchor="middle" fill="#a78bfa" font-size="8">.md</text>
      <!-- Arrow into doc -->
      <path d="M-4,28 L8,28" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" marker-end="none"/>
      <polygon points="6,24 14,28 6,32" fill="#a78bfa" opacity="0.6"/>
    </g>
    <!-- Description -->
    <text x="460" y="268" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="400">
      <tspan x="460" dy="0">When a task matches,</tspan>
      <tspan x="460" dy="17">the agent reads the full</tspan>
      <tspan x="460" dy="17"><tspan fill="#ddd6fe" font-weight="600">SKILL.md</tspan> instructions</tspan>
      <tspan x="460" dy="17">into context.</tspan>
      <tspan x="460" dy="22" fill="#64748b" font-size="10.5">Full instructions loaded</tspan>
      <tspan x="460" dy="15" fill="#64748b" font-size="10.5">on demand.</tspan>
    </text>
  </g>

  <!-- Arrow 2 → 3 -->
  <g>
    <line x1="583" y1="250" x2="631" y2="250" stroke="url(#arrowGrad2)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="631,244 645,250 631,256" fill="#22d3ee"/>
  </g>

  <!-- ==================== STEP 3: Execution ==================== -->
  <g filter="url(#shadow)">
    <rect x="650" y="110" width="230" height="280" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <!-- Badge -->
    <rect x="670" y="125" width="28" height="28" rx="8" fill="url(#card3)"/>
    <text x="684" y="145" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">3</text>
    <text x="708" y="145" fill="#a5f3fc" font-size="15" font-weight="700">Execution</text>
    <!-- Divider -->
    <line x1="665" y1="162" x2="865" y2="162" stroke="#334155" stroke-width="1"/>
    <!-- Icon: gear + play -->
    <g transform="translate(725, 185)">
      <circle cx="25" cy="25" r="22" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
      <!-- Play triangle -->
      <polygon points="18,14 38,25 18,36" fill="#22d3ee" opacity="0.6"/>
      <!-- Small gear -->
      <circle cx="44" cy="8" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
      <circle cx="44" cy="8" r="3" fill="#22d3ee" opacity="0.4"/>
    </g>
    <!-- Description -->
    <text x="765" y="268" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="400">
      <tspan x="765" dy="0">The agent follows the</tspan>
      <tspan x="765" dy="17">instructions, optionally</tspan>
      <tspan x="765" dy="17">loading <tspan fill="#a5f3fc" font-weight="600">references</tspan> or</tspan>
      <tspan x="765" dy="17">executing <tspan fill="#a5f3fc" font-weight="600">scripts</tspan>.</tspan>
      <tspan x="765" dy="22" fill="#64748b" font-size="10.5">Code and docs loaded</tspan>
      <tspan x="765" dy="15" fill="#64748b" font-size="10.5">only as needed.</tspan>
    </text>
  </g>

  <!-- Bottom: Folder structure hint -->
  <g transform="translate(200, 430)">
    <rect x="0" y="0" width="500" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="250" y="22" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1.5">SKILL STRUCTURE</text>
    <text x="250" y="42" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="'SF Mono', 'Fira Code', monospace">
      <tspan fill="#c7d2fe">SKILL.md</tspan>  ·  <tspan fill="#a78bfa">scripts/</tspan>  ·  <tspan fill="#22d3ee">references/</tspan>  ·  <tspan fill="#64748b">assets/</tspan>
    </text>
    <text x="250" y="58" text-anchor="middle" fill="#475569" font-size="10">required          optional         optional          optional</text>
  </g>
</svg>
